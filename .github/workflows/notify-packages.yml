name: Validate and notify CambonOS packages

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run package tests
        run: python -m unittest discover -s tests -v

      - name: Notify cambonos-packages
        env:
          GH_TOKEN: ${{ secrets.CAMBONOS_PACKAGES_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            '{event_type: "external-package-updated", client_payload: {repository: $repository, branch: $branch, commit: $commit}}')"
          gh api --method POST repos/CambonOS/cambonos-packages/dispatches --input - <<<"${payload}"